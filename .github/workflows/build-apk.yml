name: Build Android APK

on:
  push:
    branches: [ main, master, arena/** ]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # 3.35.x: current plugins (mobile_scanner 5.x etc.) need the newer
          # Android toolchain this ships with.
          flutter-version: "3.35.4"
          channel: "stable"

      - name: Generate platform scaffolding
        run: |
          set -o pipefail
          flutter create --platforms=android --project-name aph_mobile . 2>&1 | tee /tmp/build.log
          # flutter create can clobber tracked files (e.g. test/widget_test.dart) —
          # restore them; we only want the untracked android/ scaffolding.
          git checkout -- .
          git status --short | head -20

      - name: Install dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a /tmp/build.log

      - name: Analyze
        run: |
          set -o pipefail
          (flutter analyze --no-fatal-infos || true) 2>&1 | tee -a /tmp/build.log

      - name: Run tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee -a /tmp/build.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a /tmp/build.log

      - name: Publish failure tail as annotations
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "::group::Build log tail"
            tail -n 80 /tmp/build.log
            echo "::endgroup::"
            grep -E "Expected:|Actual:|TestFailure|EXCEPTION|which:|-[0-9]+:.*\[E\]|loading .*widget_test|error:|Error:|FAILURE|What went wrong" /tmp/build.log | head -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::error::=== last 12 lines ==="
            tail -n 12 /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aph-build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aph-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v1.0.0"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK" \
              --title "APH Mobile APK v1.0.0" \
              --notes "AbdulmajeedPharma (APH) Android release build v1.0.0+1.

Contains clearly-marked DEMO / DEVELOPMENT seed data — not for clinical use.
Owner: Dr. Abdulmajeed Abdullah Almakhedhi.
Support: WhatsApp 781733795 · 7a8b1d@gmail.com"
          else
            gh release upload "$TAG" "$APK" --clobber
          fi
