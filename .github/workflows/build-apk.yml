name: Build Android APK (AbdulmajeedPharma APH)

on:
  push:
    branches: [main, master, 'arena/**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      # توليد منصة Android الرسمية (دون المساس بـ lib/ و assets/)
      - name: Generate Android platform
        run: |
          flutter create --platforms=android --project-name pharma_encyclopedia --org com.abdulmajeedpharma /tmp/aph_gen
          rm -rf android
          cp -r /tmp/aph_gen/android android
          python3 tools/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbdulmajeedPharma-APH-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
