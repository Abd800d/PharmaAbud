name: Build Android APK

on:
  push:
    branches: [ main, master, arena/** ]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # 3.35.x: current plugins (mobile_scanner 5.x etc.) need the newer
          # Android toolchain this ships with.
          flutter-version: "3.35.4"
          channel: "stable"

      - name: Generate platform scaffolding
        run: flutter create --platforms=android --project-name aph_mobile .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Publish failure tail as annotations
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "::group::Build log tail"
            tail -n 60 /tmp/build.log
            echo "::endgroup::"
            tail -n 25 /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aph-build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aph-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
