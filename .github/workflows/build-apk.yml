name: Build Android APK (AbdulmajeedPharma APH)

on:
  push:
    branches: [main, master, 'arena/**']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      # توليد منصة Android الرسمية (دون المساس بـ lib/ و assets/)
      - name: Generate Android platform
        run: |
          flutter create --platforms=android --project-name pharma_encyclopedia --org com.abdulmajeedpharma /tmp/aph_gen
          rm -rf android
          cp -r /tmp/aph_gen/android android
          python3 tools/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      # بوابة سريعة: أخطاء الترجمة فقط (لا يحجبها تحذير تنسيق) — تفشل مبكراً قبل Gradle
      - name: Analyze (errors only — blocking)
        run: |
          set -o pipefail
          dart analyze --no-fatal-infos --no-fatal-warnings . 2>&1 | tee analyze-log.txt

      - name: Analyze (full report, non-blocking)
        run: flutter analyze 2>&1 | tee analyze-full.txt || true

      - name: Verify seed database integrity
        run: python3 tools/verify_seed.py

      # مفاتيح الذكاء الاصطناعي تُحقن وقت البناء من أسرار المستودع (لا تُكتب في الكود):
      #   APH_GEMINI_KEY  (Google AI Studio)   APH_OPENAI_KEY  (OpenAI)
      # وإن لم تُضف، يدخلها المستخدم من شاشة الإعدادات وتُحفظ على جهازه.
      - name: Build release APK (universal)
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=APH_GEMINI_KEY="${APH_GEMINI_KEY}" \
            --dart-define=APH_OPENAI_KEY="${APH_OPENAI_KEY}" 2>&1 | tee build-log.txt
        env:
          APH_GEMINI_KEY: ${{ secrets.APH_GEMINI_KEY }}
          APH_OPENAI_KEY: ${{ secrets.APH_OPENAI_KEY }}

      - name: Build release APK (split per ABI — smaller downloads)
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --dart-define=APH_GEMINI_KEY="${APH_GEMINI_KEY}" \
            --dart-define=APH_OPENAI_KEY="${APH_OPENAI_KEY}" 2>&1 | tee -a build-log.txt
        env:
          APH_GEMINI_KEY: ${{ secrets.APH_GEMINI_KEY }}
          APH_OPENAI_KEY: ${{ secrets.APH_OPENAI_KEY }}

      - name: Publish errors as annotations
        if: always()
        run: |
          { grep -E "error •|error:|Error|FAILURE|e: file|Target|What went wrong|Execution failed" analyze-log.txt build-log.txt 2>/dev/null || true; echo "---ANALYZE TAIL---"; tail -12 analyze-log.txt 2>/dev/null || true; echo "---BUILD TAIL---"; tail -25 build-log.txt 2>/dev/null || true; } | head -45 | cut -c1-240 | while IFS= read -r l; do echo "::error::$l"; done
          tail -40 build-log.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aph-build-logs
          path: |
            analyze-log.txt
            analyze-full.txt
            build-log.txt

      - name: Collect APK files
        run: |
          mkdir -p apk_out
          cp build/app/outputs/flutter-apk/app-release.apk apk_out/AbdulmajeedPharma-APH.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk_out/AbdulmajeedPharma-APH-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_out/AbdulmajeedPharma-APH-armeabi-v7a.apk || true
          ls -la apk_out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AbdulmajeedPharma-APH-release-apk
          path: apk_out/*.apk

      # رابط تحميل دائم (لا ينتهي مثل artifacts الخاصة بـ CI)
      - name: Publish APK to GitHub Release (apk-latest)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NOTES="AbdulmajeedPharma (APH) build ${VER} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Owner: Dr. Abdulmajeed Abdullah Almakhedhi. Support: WhatsApp 967781733795 - 7a8b1d@gmail.com. Install: allow unknown sources, then open AbdulmajeedPharma-APH-arm64-v8a.apk (modern phones) or the universal APK."
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest apk_out/*.apk --title "APH Mobile APK (latest)" --notes "$NOTES" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
