name: Backend CI

on:
  push:
    branches: [ main, master, arena/** ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aph
          POSTGRES_PASSWORD: aph_ci
          POSTGRES_DB: aph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (SQLite)
        run: python -m pytest tests/ -q

      - name: Run tests (PostgreSQL + migrations)
        env:
          DATABASE_URL: postgresql+psycopg2://aph:aph_ci@localhost:5432/aph_test
        run: |
          pip install psycopg2-binary
          alembic upgrade head
          python -m pytest tests/ -q
