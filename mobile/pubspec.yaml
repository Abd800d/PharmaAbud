name: aph_mobile
description: "AbdulmajeedPharma (APH) — موسوعة عبدالمجيد للأدوية. Professional Pharmaceutical Drug Encyclopedia."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state management
  provider: ^6.1.2

  # local persistence (offline-first)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # network
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # scanning (barcode)
  mobile_scanner: ^5.1.1

  # misc
  intl: ">=0.19.0 <0.21.0"
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
